name: Add or update a sandbox provider
description: Suggest a provider, correct a fact, or report a typo.
title: "[Provider] "
body:
  - type: input
    id: product
    attributes:
      label: Provider or product
      description: Include a dossier filename or website link if you know it.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: A short description is enough for a typo. For a new provider, name the exact sandbox product.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Supporting links (if applicable)
      description: Official documentation, pricing, or product links for factual changes or new providers. Not needed for typos.
